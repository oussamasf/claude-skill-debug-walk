<script>
const W = JSON.parse(document.getElementById("walk-data").textContent);
const CASES = W.cases, BUGS = W.bugs;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const json = (v) => esc(JSON.stringify(v, null, 2))
  .replace(/&quot;([^&]*?)&quot;(?=:)/g, '<span class="k">"$1"</span>')
  .replace(/: &quot;(.*?)&quot;/g, ': <span class="str">"$1"</span>')
  .replace(/: (-?\d+(\.\d+)?)/g, ': <span class="num-t">$1</span>')
  .replace(/: (null|true|false)/g, ': <span class="nil">$1</span>');
const SL = { ok: ["s-ok", "Succeeded"], fail: ["s-fail", "Failed"], skip: ["s-skip", "Not run"] };
const pill = (s) => `<span class="pill ${SL[s][0]}">${SL[s][1]}</span>`;
const stOf = (st) => st.status || "ok";
const NUM = "①②③④⑤⑥⑦⑧⑨⑩";

let cur = 0, sel = 0, dtab = "Input";

function renderTabs() {
  $("case-tabs").innerHTML = CASES.map((c, i) =>
    `<button class="tab" role="tab" aria-selected="${i === cur}" data-i="${i}">Case ${i + 1} · ${esc(c.name)} ${pill(c.status)}</button>`).join("");
}
function renderGraph() {
  const c = CASES[cur];
  $("graph-sub").textContent = c.input;
  let h = `<span class="terminal">Start</span>`;
  c.states.forEach((st, i) => {
    const prev = c.states[i - 1];
    h += `<div class="edge"></div>`;
    if (prev && prev.arm) h += `<div class="edge-label">${esc(prev.arm)}</div><div class="edge"></div>`;
    h += `<div class="row"><button class="node ${stOf(st)} ${st.type.toLowerCase()} ${i === sel ? "selected" : ""}" data-i="${i}">
      <span class="top"><span class="num">${NUM[i]} ${esc(st.name)}</span><span class="type">${esc(st.type)}</span></span>
      <span class="fn">${esc(st.fn.split("/").pop())}</span>
      ${st.iter ? `<span class="fn">${esc(st.iter)}</span>` : ""}
    </button>${st.ghost ? `<span class="ghost">not taken: ${esc(st.ghost)}</span>` : ""}</div>`;
  });
  const failed = c.status === "fail";
  h += `<div class="edge"></div><span class="terminal" style="${failed ? "color:var(--fail);border-color:var(--fail)" : ""}">${failed ? "Failed" : "End"}</span>`;
  $("graph").innerHTML = h;
}
function renderDetails() {
  const st = CASES[cur].states[sel];
  $("d-title").textContent = `${NUM[sel]} ${st.name} (${st.type})`;
  $("d-fn").textContent = st.fn;
  $("d-status").innerHTML = pill(stOf(st));
  $("d-tabs").innerHTML = ["Input", "Output", "State", "Note"].map((t) => `<button class="dtab" role="tab" aria-selected="${t === dtab}" data-t="${t}">${t}</button>`).join("");
  const body = {
    Input: `<pre>${json(st.in)}</pre>`,
    Output: `<pre>${json(st.out)}</pre>`,
    State: st.state ? `<pre>${json(st.state)}</pre>` : `<p class="note" style="color:var(--muted)">No outside state changes at this step.</p>`,
    Note: `<p class="note">${md(st.note)}</p>`,
  }[dtab];
  $("d-body").innerHTML = body + `<div class="eyebrow">values ${W.values === "real" ? "real" : "(simulated)"} · ${st.ms} ms</div>`;
}
function renderEvents() {
  const c = CASES[cur]; let id = 1, t = 0;
  const rows = [`<tr><td class="n">${id++}</td><td>ExecutionStarted</td><td>–</td><td class="n">0</td></tr>`];
  c.states.forEach((st, i) => {
    const name = `${NUM[i]} ${esc(st.name)}`, failed = stOf(st) === "fail";
    rows.push(`<tr class="ev" data-i="${i}"><td class="n">${id++}</td><td>${st.type}StateEntered</td><td>${name}</td><td class="n">${t}</td></tr>`);
    t += st.ms;
    rows.push(`<tr class="ev ${failed ? "failrow" : ""}" data-i="${i}"><td class="n">${id++}</td><td>${failed ? (st.type === "Fail" ? "ExecutionFailed" : `${st.type}StateFailed`) : `${st.type}StateExited`}</td><td>${name}</td><td class="n">${t}</td></tr>`);
  });
  if (c.status === "ok") rows.push(`<tr><td class="n">${id}</td><td>ExecutionSucceeded</td><td>–</td><td class="n">${t}</td></tr>`);
  $("events").innerHTML = rows.join("");
}
function renderStatic() {
  const wl = W.workline;
  $("h-title").textContent = W.title;
  $("sample").hidden = W.values === "real";
  $("sample-note").textContent = W.valuesNote || "";
  $("run-mode").className = `pill ${W.values === "real" ? "s-ok" : "s-skip"}`;
  $("run-mode").textContent = `Values: ${W.values}`;
  $("m-behavior").innerHTML = md(W.behavior);
  $("m-commit").textContent = W.commit;
  $("m-pinned").textContent = W.pinned;
  $("case-count").textContent = `${CASES.length} · ${CASES.filter((c) => c.status === "ok").length} succeeded, ${CASES.filter((c) => c.status === "fail").length} failed`;
  $("workline").innerHTML = wl.nodes.map((n) => `<span class="wl-node ${n.walked ? "walked" : ""}">${esc(n.label)}</span>`).join(`<span class="wl-arrow">→</span>`);
  $("wl-notes").innerHTML = [["Workline", wl.purpose], ["Walked segment", wl.segment], ["Downstream risk", wl.risk], ["Other triggers", wl.others || "none"]]
    .map(([k, v]) => `<div><b>${k}:</b> ${md(v)}</div>`).join("");
  $("cases").innerHTML = CASES.map((c, i) => `<tr><td>${i + 1} · ${esc(c.name)}</td><td><code>${esc(c.input)}</code></td><td><code>${esc(c.exit)}</code></td><td><code>${esc(c.result)}</code></td><td>${pill(c.status)}</td></tr>`).join("");
  $("bugs").innerHTML = BUGS.map((b) => `<div class="bug"><div class="t">${esc(b.title)} <span class="conf ${b.conf}">${b.conf}</span></div>
    <div>Trigger: <code>${esc(b.trigger)}</code>. At step <code>${esc(b.at)}</code>: ${md(b.what)}</div></div>`).join("");
}
function render() { renderTabs(); renderGraph(); renderDetails(); renderEvents(); }

$("case-tabs").addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (!b) return; cur = +b.dataset.i; sel = 0; render(); });
$("graph").addEventListener("click", (e) => { const b = e.target.closest(".node"); if (!b) return; sel = +b.dataset.i; renderGraph(); renderDetails(); });
$("d-tabs").addEventListener("click", (e) => { const b = e.target.closest(".dtab"); if (!b) return; dtab = b.dataset.t; renderDetails(); });
$("events").addEventListener("click", (e) => { const r = e.target.closest("tr.ev"); if (!r) return; sel = +r.dataset.i; renderGraph(); renderDetails(); $("graph").scrollIntoView({ block: "nearest", behavior: "smooth" }); });

renderStatic(); render();
</script>
